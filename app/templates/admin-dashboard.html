<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <style>
    body {
      background-color: #f0f8ff;
      font-family: 'Segoe UI', sans-serif;
      padding: 30px;
      color: #333;
    }

    h2 {
      color: #007BFF;
      text-align: center;
    }

    .search-box {
      display: flex;
      justify-content: center;
      margin: 20px auto;
    }

    input {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      width: 300px;
      font-size: 16px;
    }

    button {
      padding: 10px 20px;
      margin-left: 10px;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    #error {
      text-align: center;
      color: red;
      margin-top: 10px;
    }

    .result-container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .result-container h3 {
      color: #007BFF;
    }

    pre {
      background-color: #f4f6f8;
      padding: 10px;
      border-left: 4px solid #007BFF;
      overflow-x: auto;
    }

    hr {
      border: none;
      border-top: 1px solid #ccc;
      margin: 15px 0;
    }
  </style>
</head>
<body>
  <h2>Admin Dashboard</h2>
  <div class="search-box">
    <input type="number" id="studentId" placeholder="Enter Student ID">
    <button onclick="searchStudent()">Search</button>
  </div>
  <p id="error"></p>
  <div id="result" class="result-container"></div>

  <script>
    async function searchStudent() {
      const studentId = document.getElementById('studentId').value;
      const token = localStorage.getItem('token');
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = "";
      document.getElementById("error").innerText = "";
  
      const response = await fetch(`http://127.0.0.1:8000/admin/admin/search-user/${studentId}`, {
        headers: {
          Authorization: `Bearer ${token}`
        }
      });
  
      if (!response.ok) {
        document.getElementById("error").innerText = "Student not found or unauthorized!";
        return;
      }
  
      const data = await response.json();
  
      let html = `
        <h3>Student Info</h3>
        <p><strong>ID:</strong> ${data.student.id}</p>
        <p><strong>Name:</strong> ${data.student.name}</p>
        <p><strong>Email:</strong> ${data.student.email}</p>
        <p><strong>Mobile:</strong> ${data.student.mobile}</p>
        <p><strong>Language:</strong> ${data.student.language}</p>
        <p><strong>MCQ Result:</strong> ${data.mcq_result}</p>
        <h3>Coding Results</h3>
      `;
  
      if (data.coding_results.length === 0) {
        html += "<p>No coding results found.</p>";
      } else {
        data.coding_results.forEach((res, index) => {
          const statusColor = res.status === "Passed" ? "green" : "red";
          html += `
            <hr>
            <p><strong>Q${index + 1}:</strong> ${res.question}</p>
            <p><strong>Status:</strong> 
              <span style="color: white; background-color: ${statusColor}; padding: 4px 8px; border-radius: 6px;">
                ${res.status}
              </span>
            </p>
            <p><strong>Language:</strong> ${res.language}</p>
            <p><strong>Submitted At:</strong> ${res.submitted_at}</p>
            <p><strong>Code:</strong></p>
            <pre>${res.code_submitted}</pre>
          `;
        });
      }
  
      resultDiv.innerHTML = html;
    }
  </script>
  
</body>
</html>
