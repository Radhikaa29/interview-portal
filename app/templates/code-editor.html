<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Editor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.34.1/min/vs/loader.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
        }
        h1, h3 { text-align: center; }
        #editorContainer { width: 100%; height: 400px; border: 1px solid #ccc; }
        .controls { margin-top: 10px; display: flex; justify-content: space-between; }
        select, button, textarea { padding: 8px; font-size: 16px; width: 100%; margin-top: 10px; }
        #outputContainer { margin-top: 20px; padding: 10px; background-color: #e8e8e8; border-radius: 5px; }
        #testCasesContainer { margin-top: 20px; padding: 10px; background-color: #ffffff; border: 1px solid #ccc; }
    </style>
</head>
<body>

    <h1>Online Code Editor</h1>
    
    <h3 id="questionText">Loading question...</h3>

    <div id="testCasesContainer">
        <h3>Test Cases:</h3>
        <ul id="testCasesList">Loading test cases...</ul>
    </div>

    <label for="languageSelector">Select Language:</label>
    <select id="languageSelector">
        <option value="python">Python</option>
        <option value="javascript">JavaScript</option>
        <option value="cpp">C++</option>
        <option value="java">Java</option>
        <option value="php">php</option>
    </select>

    <label for="inputData">Input Data (optional):</label>
    <textarea id="inputData" placeholder="Enter input data"></textarea>

    <div id="editorContainer"></div>

    <div class="controls">
        <button id="runButton">Run Code</button>
        <button id="submitButton">Submit Code</button>
        <button onclick="clearEditor()">Clear</button>
    </div>

    <h3>Output:</h3>
    <pre id="outputContainer">Output will appear here...</pre>

    <script>
        let editor;

        // ✅ Load Monaco Editor
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.34.1/min/vs' } });
        require(["vs/editor/editor.main"], function () {
            editor = monaco.editor.create(document.getElementById("editorContainer"), {
                value: "// Write your code here...",
                language: "python",
                theme: "vs-dark"
            });
        });

        // ✅ Fetch and Display Question with Test Cases
        async function loadQuestion() {
            const urlParams = new URLSearchParams(window.location.search);
            const questionId = urlParams.get("questionId");

            if (!questionId) {
                document.getElementById("questionText").innerText = "Error: No question selected.";
                return;
            }

            try {
                const response = await fetch(`/coding/question/${questionId}`, {
                    method: "GET",
                    headers: { "Authorization": `Bearer ${localStorage.getItem("token")}` }
                });

                if (!response.ok) throw new Error("Failed to fetch question");

                const data = await response.json();
                document.getElementById("questionText").innerText = data.question;

                // ✅ Display Test Cases
                const testCasesList = document.getElementById("testCasesList");
                testCasesList.innerHTML = ""; // Clear previous test cases

                if (!data.test_cases || data.test_cases.length === 0) {
                    testCasesList.innerHTML = "<li>No test cases available.</li>";
                } else {
                    data.test_cases.slice(0,2).forEach(tc => {
                        const li = document.createElement("li");
                        li.innerHTML = `<b>Input:</b> ${tc.input} | <b>Expected Output:</b> ${tc.expected_output}`;
                        testCasesList.appendChild(li);
                    });
                }
            } catch (error) {
                console.error("Error loading question:", error);
                document.getElementById("questionText").innerText = "Error loading question.";
                document.getElementById("testCasesList").innerHTML = "<li>Error loading test cases.</li>";
            }
        }

        // ✅ Run Code via Piston API
        async function runCode() {
            const code = editor.getValue(); // Get code from Monaco Editor
            const language = document.getElementById("languageSelector").value;
            const inputData = document.getElementById("inputData")?.value || ""; // Get user input (if any)

            // 🔹 Define supported languages and their versions
            const languageSettings = {
                "python": { version: "3.10.0", fileName: "main.py" },
                "javascript": { version: "18.15.0", fileName: "main.js" },
                "cpp": { version: "10.2.0", fileName: "main.cpp" },
                "java": { version: "15.0.2", fileName: "Main.java" },
                "php": { version: "8.2.3", fileName: "main.php" }
            };

            // Check if the selected language is supported
            if (!languageSettings[language]) {
                document.getElementById("outputContainer").textContent = `Error: Language '${language}' is not supported.`;
                return;
            }

            // Get the correct version and filename
            const { version, fileName } = languageSettings[language];

            // 🔹 Java requires class Main
            if (language === "java" && !code.includes("class Main")) {
                document.getElementById("outputContainer").textContent = "Error: Java code must include 'class Main { }' with a main method.";
                return;
            }

            // 🔹 Construct the request payload
            const requestBody = {
                language: language,
                version: version,
                files: [{ name: fileName, content: code }],
                stdin: inputData
            };

            console.log("Sending request:", requestBody); // Debugging

            try {
                const response = await fetch("https://emkc.org/api/v2/piston/execute", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                const result = await response.json();
                console.log("API Response:", result); // Debugging

        if (result.run && result.run.output !== undefined) {
            document.getElementById("outputContainer").textContent = result.run.output;
        } else {
            document.getElementById("outputContainer").textContent = "Error: No output received.";
        }
    } catch (error) {
        console.error("Error executing code:", error);
        document.getElementById("outputContainer").textContent = "Execution error. Check console.";
    }
}
async function submitCode() {
    const code = editor.getValue();
    const language = document.getElementById("languageSelector").value;

            const requestBody = {
                language: language,
                code: code
            };

            const urlParams = new URLSearchParams(window.location.search);
            const questionId = urlParams.get("questionId");

            try {
                const response = await fetch(`/coding/coding/submit/${questionId}`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${localStorage.getItem("token")}`
                    },
                    body: JSON.stringify(requestBody)
                });

                const result = await response.json();
                document.getElementById("outputContainer").textContent = `Result: ${result.status}`;
            } catch (error) {
                console.error("Submission error:", error);
                document.getElementById("outputContainer").textContent = "Error submitting code.";
            }
        }

        // Attach function to "Submit Code" button
        document.getElementById("submitButton").addEventListener("click", submitCode);



        // ✅ Clear Editor
        function clearEditor() {
            editor.setValue("");
        }

        // ✅ Load Question on Page Load
        document.addEventListener("DOMContentLoaded", () => {
            loadQuestion();
            document.getElementById("runButton").addEventListener("click", runCode);
        });
    </script>

</body>
</html>
