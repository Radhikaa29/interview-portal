<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student details</title>
  <style>
    body {
      background-color: #f0f8ff;
      font-family: 'Segoe UI', sans-serif;
      padding: 30px;
      color: #333;
    }

    h2 {
      color: #007BFF;
      text-align: center;
    }

    #error {
      text-align: center;
      color: red;
      margin-top: 10px;
    }

    .result-container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
 



    .result-container h3 {
      color: #007BFF;
    }

    pre {
      background-color: #f4f6f8;
      padding: 10px;
      border-left: 4px solid #007BFF;
      overflow-x: auto;
    }

    hr {
      border: none;
      border-top: 1px solid #ccc;
      margin: 15px 0;
    }
    .pass-box {
  text-align: center;
  margin: 20px auto;
  padding: 15px 25px;
  background-color: #d4edda;
  color: #155724;
  font-weight: bold;
  border: 1px solid #c3e6cb;
  border-radius: 8px;
  max-width: 400px;
}
.fail-box {
  text-align: center;
  margin: 20px auto;
  padding: 15px 25px;
  background-color: #f8d7da;
  color: #721c24;
  font-weight: bold;
  border: 1px solid #f5c6cb;
  border-radius: 8px;
  max-width: 400px;
}


  </style>
</head>
<body>
  <h2>Student Details</h2>
  <p id="error"></p>
  <div id="result" class="result-container"></div>

  <script>
    async function fetchStudentDetail() {
      const urlParams = new URLSearchParams(window.location.search);
      const studentId = urlParams.get('id');
      const token = localStorage.getItem('token');
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = "";
      document.getElementById("error").innerText = "";

      if (!studentId) {
        document.getElementById("error").innerText = "No student ID found in URL!";
        return;
      }

      const response = await fetch(`http://127.0.0.1:8000/admin/admin/search-user/${studentId}`, {
        headers: {
          Authorization: `Bearer ${token}`
        }
      });

      if (!response.ok) {
        document.getElementById("error").innerText = "Student not found or unauthorized!";
        return;
      }

      const data = await response.json();

      let html = `

    <h3>Student Info</h3>
      
    <p><strong>ID:</strong> ${data.student.id}</p>
    <p><strong>Name:</strong> ${data.student.name}</p>
    <p><strong>Email:</strong> ${data.student.email}</p>
    <p><strong>Mobile:</strong> ${data.student.mobile}</p>
    <p><strong>Language:</strong> ${data.student.language}</p>
    <p><strong>MCQ Result:</strong> ${data.mcq_result}</p>
    
    <h3>Coding Results</h3>
`;
let passedCount = 0;
  data.coding_results.forEach(res => {
    if (res.status === "Passed") {
      passedCount++;
    }
  });

      if (data.coding_results.length === 0) {
        html += "<p>No coding results found.</p>";
      } else {
        data.coding_results.forEach((res, index) => {
          const statusColor = res.status === "Passed" ? "green" : "red";
          html += `
            <hr>
            <p><strong>Q${index + 1}:</strong> ${res.question}</p>
            <p><strong>Status:</strong> 
              <span style="color: white; background-color: ${statusColor}; padding: 4px 8px; border-radius: 6px;">
                ${res.status}
              </span>
            </p>
            <p><strong>Language:</strong> ${res.language}</p>
            <p><strong>Submitted At:</strong> ${res.submitted_at}</p>
            <p><strong>Code:</strong></p>
            <pre>${res.code_submitted}</pre>
          `;
        });
      }
      let resultBox = "";
      if (data.mcq_result > 10 && passedCount >= 3) {
    html = `
      <div class="pass-box">🎉 This student <strong>passed</strong> the test!</div>
    ` + html;
  }
  else {
  html = `
    <div class="fail-box">❌ This student <strong>did not pass</strong> the test.</div>
  ` + html;
}
      resultDiv.innerHTML =resultBox + html;
    }

    // Call it on page load
    fetchStudentDetail();
  </script>

</body>
</html>
