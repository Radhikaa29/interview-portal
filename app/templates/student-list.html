<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student List</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f1f9ff;
      margin: 0;
      padding: 20px;
    }

    h2 {
      color: #1e90ff;
      text-align: center;
    }

    table {
      width: 80%;
      margin: 20px auto;
      border-collapse: collapse;
      background-color: #ffffff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    th, td {
      padding: 12px 20px;
      border-bottom: 1px solid #ddd;
      text-align: center;
    }

    th {
      background-color: #1e90ff;
      color: white;
    }

    button {
      background-color: #1e90ff;
      color: white;
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #187bcd;
    }
  </style>
</head>
<body>
  <h2>Student List</h2>
  <table id="studentTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <!-- Students will be dynamically inserted here -->
    </tbody>
  </table>

  <script>
    async function fetchStudents() {
      try {
        const response = await fetch('http://127.0.0.1:8000/admin/admin/students');
        const students = await response.json();

        const tableBody = document.querySelector("#studentTable tbody");
        students.forEach(student => {
          const row = document.createElement("tr");

          row.innerHTML = `
            <td>${student.id}</td>
            <td>${student.username}</td>
            <td>
              <button onclick="viewDetails(${student.id})">View Details</button>
            </td>
          `;
          tableBody.appendChild(row);
        });
      } catch (error) {
        console.error("Failed to fetch students:", error);
      }
    }

    function viewDetails(id) {
      window.location.href = `/view-details?id=${id}`;
    }

    fetchStudents();
  </script>
</body>
</html>
